name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # changesets/action is used ONLY to version packages and open/update
      # the "Version Packages" PR. We deliberately do NOT pass a publish
      # script here - changesets/action does not propagate the OIDC env vars
      # (ACTIONS_ID_TOKEN_REQUEST_URL / _TOKEN) to the spawned npm process,
      # so npm publish would fail with ENEEDAUTH. Publishing happens in a
      # separate top-level step below where env vars flow through cleanly.
      - name: Create Version Packages PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # When there are no changesets (i.e. the "Version Packages" PR was
      # merged), changesets/action does nothing - so we publish directly.
      - name: Publish to npm
        if: steps.changesets.outputs.has-changesets == 'false'
        run: bash scripts/publish-release.sh
