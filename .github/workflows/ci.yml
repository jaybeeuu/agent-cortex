name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Install run-beads deps
        run: pnpm --prefix skills/run-beads/scripts install --frozen-lockfile
      - name: Install create-task deps
        run: pnpm --prefix skills/create-task/scripts install --frozen-lockfile
      - name: Run run-beads tests
        run: pnpm --prefix skills/run-beads/scripts test
      - name: Run plugin manifest regression test
        run: node --test plugin.manifest.test.mjs
      - name: Run run-beads typecheck
        run: pnpm --prefix skills/run-beads/scripts typecheck
      - name: Run create-task typecheck
        run: pnpm --prefix skills/create-task/scripts typecheck
