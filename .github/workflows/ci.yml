name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upload node_modules
        uses: actions/upload-artifact@v4
        with:
          name: node-modules
          path: node_modules
          retention-days: 1

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            dist
            build
            *.js
            *.mjs
          retention-days: 1

  changeset:
    name: Changeset check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for changeset
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # Paths that require a changeset when modified
          VERSIONED_PATHS='extensions/\|skills/\|agents/\|package.json\|plugin.json'

          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          echo "Changed files:"
          echo "$changed"

          versioned=$(echo "$changed" | grep -E "$VERSIONED_PATHS" || true)
          if [ -z "$versioned" ]; then
            echo "No versioned paths changed — skipping changeset check."
            exit 0
          fi

          changesets=$(echo "$changed" | grep -E '^\.changeset/.*\.md$' | grep -v 'README.md' || true)
          if [ -z "$changesets" ]; then
            echo ""
            echo "::error::This PR modifies versioned paths but does not include a changeset."
            echo "Run 'pnpm changeset' to add one. See: style-versioning skill."
            echo ""
            echo "Versioned paths changed:"
            echo "$versioned"
            exit 1
          fi

          echo "Changeset found: $changesets"

  checks:
    name: Checks
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download node_modules
        uses: actions/download-artifact@v4
        with:
          name: node-modules
          path: node_modules

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Check generated Claude plugin is up to date
        run: |
          pnpm build:claude
          git diff --exit-code claude/agents/ claude/skills/
