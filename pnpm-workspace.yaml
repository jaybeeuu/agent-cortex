packages:
  - "."
  - "extensions/*"
allowBuilds:
  '@google/genai': false
  esbuild: false
  # koffi (an optionalDependency of @mariozechner/pi-tui, which pi-questions
  # peers on) ships prebuilt build/koffi/<platform>_<arch>/*.node binaries that
  # index.js loads directly. Its install script (cnoke --prebuild) only
  # matters for toolchains with no shipped binary, so deny it: acknowledged
  # explicitly to satisfy the strict allowlist, no compilation, no download.
  koffi: false
  protobufjs: false
